[ProtegerArmas]
; Em missao, a missao nao troca nem tira as suas armas de fogo dos espacos abaixo. Se ela da outra arma no lugar da
; sua, a arma continua a sua e a municao vai para ela; se ela pergunta pela arma dela, o jogo responde pela sua.
; Municao infinita ou mexida pela missao: no fim volta ao que voce tinha ao comecar a missao, mais 1 caixa (a do
; traficante) se teve infinita e voce venceu. Missao que tira todas as armas: tira, e as suas de fogo voltam quando
; ela termina. Morreu ou foi preso: vale a regra do jogo. Espaco que estava vazio: como no jogo original. 0 desliga
