MissionModels=420,438,596,597,598,599,523,427,490,528,601,432,425,447,497,430,416,407,544,575,537,538,609
; modelos em que B atira (botao Atirar dentro do veiculo, alem do drive-by com submetralhadora)
FireModels=432,564,441,407,601,430,425,520
; modelos em que LB atira (botao Atirar 2 em aeronaves armadas)
Fire2Models=425,447,464,476,520

[Fixes]
; 1 corrige as contas do jogo que dependem do x87 em precisao simples (no iPhone: falas e sons de missao
; trocados, telefone com fala de pedestre, barbeiro travado, clima ciclando sozinho). No PC nao muda nada
X87=1
; 1 pula os videos de abertura (Logo e GTAtitles) e vai direto ao menu, sem esperar toque
SkipIntro=1
; 1 protege contra arma fora da memoria (sem icone, CJ de maos vazias, jogo travando ao mirar): pede o
; modelo e as animacoes de novo, devolve a arma para a mao e evita o travamento
WeaponGuard=1

[Hud]
; radar (e o painel de status do TAB logo abaixo dele) no canto de cima a esquerda: distancia do topo,
; em unidades de uma tela de 448 de altura (16 = colado no topo). 0 deixa o radar embaixo, como no PC
RadarTop=16

[Action]
; scripts que leem o TAB o tempo todo e nao devem trocar o icone do botao para telefone (separados por virgula)
IgnoreScripts=

[Skins]
; Skin Selector: a pe, segure o Status e toque no Atirar para abrir o menu de skins
; (o jogo recebe TAB + arma anterior + proxima arma juntos). 0 desliga
Menu=1
; nomes dos scripts do Skin Selector (eles leem o TAB o tempo todo e nao viram pedido de telefone)
Scripts=skin_o,skin_c,skin_n
; 1: com uma skin, o CJ anda, corre e fica parado como o personagem do modelo (homem, mulher, gangue...),
; em vez do jeito do CJ pelos status. Com armas pesadas, motosserra e jetpack continua o do CJ. 0 desliga
Anims=1
; 1: com uma skin, as falas do CJ saem com a voz do personagem do modelo (se ele tiver voz). 0 desliga
Voice=1
; 1: com uma skin, quando uma missao troca as roupas do CJ (balaclava etc.), a skin continua e as roupas
; da missao aparecem quando o CJ voltar (cutscene, loja ou escolhendo o CJ no menu). 0 desliga
KeepSkin=1

[Garage]
; Garagem pelo telefone. Os carros guardados nas garagens das suas casas viram seus. Segure o Status e toque
; no Pular: o personagem pega o telefone; escolha "Carro da garagem" (analogico escolhe, Atirar confirma, Pular volta).
; Cada carro: Chamar, Mandar para a garagem, Trocar placa, Vender (mercado negro) ou Repor (destruido).
; Um membro da Grove traz o carro e vai embora. Seu carro na rua nao some; destruido, repoe pela lista.
; Cada garagem guarda quantos carros couberem nela (ate 4). Guardar outro carro nao tira de voce os que estao
; fora: se faltar espaco, eles ficam "sem vaga" e entram quando abrir lugar.
; Trocar placa: no iPhone abre o teclado (precisa do IPA com o overlay 3.3); no PC, digite e Enter salva.
; 0 desliga
Enabled=1
; preco para repor um carro destruido na garagem
Price=1250
; venda no mercado negro: porcentagem do valor do carro no jogo (vezes o estado dele, no minimo metade)
SellPercent=15

[Gyro]
; Giroscopio do iPhone (precisa do IPA com o overlay 3.5). Gira so a camera, como um mouse: sempre na mira e, se
; ligado no painel, tambem a pe e dirigindo; ai a camera vira e fica. Olhar atras (no veiculo) e Centralizar
; (a pe) voltam a camera para tras. Os ajustes ficam no painel do overlay: lapis > Giroscopio.
; 0 ignora o giroscopio
Enabled=1

[Traficante]
; Traficante de armas pelo telefone: Status + Pular > "Traficante de armas". Ele vem numa van preta, para perto
; de voce e abre as portas de tras; va ate a traseira da van para abrir o menu (analogico escolhe, Atirar compra,
; Pular volta). Compre a arma uma vez e depois so a municao, em caixas. Se voce se afastar, ele vai embora.
; Policia: com as portas abertas, se ela ver voce comprando, voce ganha 2 estrelas e ele foge; se ver so a van,
; ela persegue o traficante e ele fica 1 dia do jogo sem atender. Atacar o traficante tambem deixa ele 1 dia
; sem atender. 0 desliga
Enabled=1
; quanto custa cada ligacao (ele vir ate voce)
CallPrice=250
; quanto mais barato que a AmmuNation (%), para o que a AmmuNation ja vende na fase em que voce esta
Discount=15
; "fora de epoca" (a AmmuNation ainda nao vende; as pesadas antes de Las Venturas): vezes o preco da arma e da
; caixa, e quantas caixas (ou pacotes) por arma por dia do jogo
LockedMultiplier=10
LockedBoxesPerDay=2
; minutos do jogo sem atender depois que a policia perseguiu ou voce atacou (1440 = 1 dia)
CooldownMinutes=1440
; distancia (m) em que ele fecha as portas e vai embora
LeaveDistance=40
; Precos (deixe a linha comentada para usar o padrao). Armas: preco base, tiros por caixa, preco da caixa.
