TargetSwitchDegrees=10
; 1 tambem troca de alvo com um toque no analogico direito para o lado
TargetSwitchStick=1

[Traficante]
; Traficante de armas pelo telefone: Status + Pular > "Traficante de armas". Ele vem numa van preta e para na
; rua mais perto de voce no seu nivel; perto (70 m), no seu nivel e com caminho livre a vista (sem parede, muro ou
; cerca no meio), vem reto ate voce, mesmo fora das ruas (canal, beco). Perto e 15 s sem avancar: para ali mesmo (o
; mais perto que deu) e espera. Longe e 60 s sem chegar mais perto: e puxado para uma rua no seu nivel, fora da tela
; e longe de delegacia. Com ele parado esperando, o telefone mostra "Traficante de armas (venha ate aqui)": ele
; fecha as portas e vem ate onde voce esta agora (sem custo; pode chamar quantas vezes quiser).
; As portas de tras so abrem quando voce chega na traseira e fecham quando voce sai. Pare atras da van por 1
; segundo: ele pergunta se voce quer comprar (Sim abre o menu, Nao dispensa). No menu: analogico escolhe, Atirar
; compra, Pular volta; "Dispensar o traficante" no fim da lista. Compre a arma uma vez e depois so a municao, em
; caixas. Dispensado, ele sai com calma; se voce se afastar por 10 s, ele vai embora acelerando.
; Policia: so conta com as portas abertas e o policial perto, atras da van e com visao da traseira. Se ela ver
; voce comprando, voce ganha 2 estrelas e ele foge; se ver so a van aberta, ela persegue o traficante e ele fica
; 1 dia do jogo sem atender. Com as portas fechadas e so uma van. Atacar o traficante tambem deixa ele 1 dia sem
; atender. 0 desliga
Enabled=1
; quanto custa cada ligacao (ele vir ate voce)
CallPrice=250
; quanto mais barato que a AmmuNation (%), para o que a AmmuNation ja vende na fase em que voce esta
Discount=15
; "fora de epoca" (a AmmuNation ainda nao vende; as pesadas antes de Las Venturas): vezes o preco da arma e da
; caixa, e quantas caixas (ou pacotes) por arma por dia do jogo. A caixa sai a preco normal, sem limite, se outra
; arma do mesmo calibre ja esta liberada (9mm: pistolas, Tec-9, Micro SMG e SMG; calibre 12: as tres escopetas;
; .308: os dois rifles). AK-47 (7.62x39) e M4 (5.56) nao dividem caixa
