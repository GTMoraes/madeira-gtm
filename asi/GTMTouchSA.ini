[Transito]
; 1: nenhum carro aleatorio surge logo a frente do seu carro, nem quando voce olha para tras. O jogo cria esses
; carros fora da tela, entao olhar para tras deixava a pista da frente livre para eles aparecerem a poucos metros.
; Com isso ligado, a faixa a frente conta como "na tela" e o carro nasce em outro ponto (dos lados, atras, ou mais
; longe quando a frente estiver na tela). Os carros que ja existem nao somem. 0 desliga
Enabled=1
; tamanho da faixa: o que o carro percorre nesse numero de segundos, entre MinDistance e MaxDistance (metros)
Seconds=4
MinDistance=40
MaxDistance=160
; meia largura da faixa no comeco (metros); ela abre um pouco com a distancia
Width=12

[Vigilante]
; Missao Vigilante: a policia nao persegue voce enquanto durar, os policiais da rua ajudam
; contra os suspeitos, e o Sim/Nao do overlay chama a policia:
;   Sim: reforco. Duas viaturas, cada uma com sua espera: fica em uso ate a perseguicao em que voce a chamou
;        acabar e depois espera BackupCooldown segundos. Sempre 4 policiais; os 3 caronas atiram de dentro da
;        viatura. A 1a numa perseguicao: motorista de pistola, carona da frente de escopeta, os de tras sorteados
;        entre MP5, escopeta, pistola e Desert Eagle, cada um atirando com a propria arma.
;        A 2a na mesma perseguicao: todos de MP5, viatura preta e a prova de bala.
;   Nao: uma viatura com um policial so, que para perto de voce, desce e deixa a viatura (SingleCooldown s).
; 0 desliga tudo isto
Enabled=1
; 1: nivel de procurado fica em zero e a policia ignora voce durante a missao
PoliceIgnore=1
; tempo para voltar para a viatura depois de sair dela (o jogo da 60)
OutOfCarSeconds=120
; policiais da rua a ate HelpRadius metros de um suspeito vao atras dele: dirigindo, com sirene atras do carro dele;
; a pe, sempre de pistola
StreetCopsHelp=1
HelpRadius=100
BackupCooldown=60
SingleCooldown=60
; distancia em que as viaturas nascem (metros, fora da tela quando da)
SpawnMin=30
SpawnMax=70
; modelos dos policiais: a policial feminina da regiao em Chance% das vezes (secao [PoliciaisFemininas], se o
; jogo tiver o modelo), senao revezando o policial da regiao e os de Models
Models=dsher,csher
; Police Ranger (2 lugares, no interior): vem uma segunda viatura para completar os 4 policiais.
; Policiais do reforco: vida (o normal e 100) e colete; eles nao morrem de um tiro so na cabeca
CopHealth=300
CopArmour=100
; 1: a mira automatica do CJ nao trava em policiais durante o Vigilante
NoAutoAimOnCops=1
; o bonus de tempo de cada nivel vem dobrado a cada N niveis (3: niveis 3, 6, 9, 12...). 0 desliga
DoubleBonusEvery=3
; reforco perdido (longe do suspeito, preso, na agua ou a pe com o suspeito fugindo de carro) some e volta perto
; do suspeito, dentro das viaturas, quando voce esta a mais de 80 m dele; a pe e com a viatura perto, eles voltam a ela
; depois de completar o nivel 12: de 1 a MaxStars estrelas, o nivel de procurado cai mais rapido quando nao ha
; policial a CopRadius metros. Cada estrela inteira leva StarSeconds segundos na cidade (no interior, metade).
; No jogo, uma estrela inteira leva uns 130 s na cidade; 65 e o dobro da velocidade. 5 e 6 estrelas ficam como no jogo
Level12Wanted=1
MaxStars=4
StarSeconds=65
CopRadius=60
; Recompensas por nivel (o maior nivel do Vigilante que voce completou, a estatistica do jogo):
;  12: mirar num policial sem estar procurado nao da estrela e ele nem reage. Mira travada num policial da rua
;      (a pe, sem estar procurado): Sim recruta ele para o seu grupo, como os da gangue. O recrutado tem a vida e o
;      colete de CopHealth/CopArmour, pistola ou escopeta sorteada, ataca gangues (menos a Grove), traficantes e
;      criminosos, e quem atacar voce, os recrutados ou quem voce atacar. No seu carro, atira da janela: no
;      Vigilante sempre; fora dele so contra quem atacar voce. Procurado, eles vao embora. Dispensar: telefone.
;      No Vigilante, o telefone liga para o armeiro da policia: igual ao traficante, de graca, num Enforcer com
;      um SWAT, e a policia nao liga para ele.
;  21: alarme de carro roubado, viatura roubada e batida em viatura nao dao estrela. Ate RecruitMax21 recrutas,
;      com Desert Eagle, doze de combate ou M4 sorteada.
;  32: Vigilante sem timer.
;  64: Vigilante a qualquer hora: a pe pelo telefone (Comecar/Encerrar o Vigilante) ou em qualquer veiculo pelo
;      botao de submissao (taxi, ambulancia, bombeiro e Boxville continuam com a submissao deles). O armeiro
;      atende sempre. A policia ignora qualquer crime seu (estrela so a que a missao der; zona restrita fica como
;      no jogo) e vai atras dos seus alvos. As estrelas caem StarSeconds64 por estrela ate a 4a (32 = 4x o jogo).
;      Quem traz e leva o carro da garagem e uma policial da regiao.
; 1 liga o recrutamento de policiais
Recruit=1
RecruitMax12=1
RecruitMax21=3
; recrutas a pe: so recebem ordem de atacar quem estiver ate esta distancia (m) de voce
RecruitTargetRadius=35
; recruta a pe mais longe que isto (m) de voce, ou alvo que fugiu para alem disto + 10 m: ele larga o alvo e volta.
; Com voce num veiculo, os recrutas a pe entram nele como passageiros e no veiculo so atiram da janela. O botao do
; grupo (seta para cima, sem mira travada) chama todos de volta e por 10 s eles nao recebem ordem de atacar a pe
RecruitReturnDistance=40
; 1: no nivel 64, os policiais da rua vao atras de quem atacou voce e de quem voce atacou (por 60 s)
Level64CopsHelp=1
StarSeconds64=32
; para testar: finge este nivel do Vigilante (0 usa o seu nivel de verdade)
TestLevel=0
; 1: durante o Vigilante voce nunca fica procurado, como nas missoes do jogo (maximo de 0 estrelas e nenhum crime
; registrado, entao nada de scanner da policia e os recrutas nao vao embora). No fim da missao volta como era
NuncaProcurado=1
; 1: policial de moto que entra na perseguicao atira com a pistola montado na moto quando o suspeito esta a ate 35 m
PolicialDeMotoAtira=1
; 1: o botao Salvar funciona no Vigilante, como checkpoint. Ao carregar esse save, o Vigilante volta sozinho no mesmo
; nivel, com as mesmas kills, e as viaturas de reforco que estavam com voce voltam (suspeitos novos; recrutas nao).
; Abaixo do nivel 64, so dirigindo a viatura (ela volta junto, por [Save] KeepVehicle). Fora de interior. Autosave
; nao salva no Vigilante. 0: como no jogo
SalvarNaMissao=1

[Garage]
; Garagem pelo telefone. Os carros guardados nas garagens das suas casas viram seus. Segure o Status e toque
; no Pular: o personagem pega o telefone; escolha "Carro da garagem" (analogico escolhe, Atirar confirma, Pular volta).
; Cada carro: Chamar, Mandar para a garagem, Mandar consertar, Trocar placa, Vender (mercado negro) ou Repor
; (destruido). Um membro da Grove traz o carro, sempre lavado, e vai embora. Mandar consertar: com o carro perto,
; ele vem buscar, sai dirigindo e uns 10 s depois volta com o carro consertado e lavado; longe, o carro vai direto
; para o conserto e volta ate voce. Seu carro na rua nao some; destruido, repoe pela lista. No Pay 'n' Spray, um
; carro seu e consertado e lavado, mas a cor nao muda.
; Cada garagem guarda quantos carros couberem nela (ate 4). Guardar outro carro nao tira de voce os que estao
; fora: se faltar espaco, eles ficam "sem vaga" e entram quando abrir lugar.
; Trocar placa: no iPhone abre o teclado (precisa do IPA com o overlay 3.3); no PC, digite e Enter salva.
; 0 desliga
Enabled=1
; preco para repor um carro destruido na garagem
Price=1250
; venda no mercado negro: porcentagem do valor do carro no jogo (vezes o estado dele, no minimo metade)
SellPercent=15

