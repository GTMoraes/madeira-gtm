[Steer]
; 1 liga, 0 desliga a direcao pelas setas (D-pad esquerda/direita) dentro de veiculos
Enabled=1
; tempo (ms) para ir do centro ao esterco total segurando a seta
RampMs=150
; tempo (ms) para a direcao voltar ao centro ao soltar
ReleaseMs=60

[Touch]
; 1 recebe os toques do overlay do Madeira (GTMTouch)
Enabled=1

[Save]
; slot usado pelo botao Salvar e pelos autosaves (1 a 8)
Slot=8
; autosave a cada N minutos fora de missao (0 desliga)
AutosaveMinutes=5
; 1 faz autosave alguns segundos depois de passar uma missao
AfterMission=1
; 1 guarda o veiculo em que voce estava e o recria ao carregar
KeepVehicle=1

[YesNo]
; Sim/Nao aparecem quando um pedestre puxa conversa, numa conversa de missao, quando o
; texto de ajuda pede Sim/Nao e (com Scripts=1) quando um script le as setas esquerda/direita
Scripts=1
; nomes de scripts que nao devem mostrar Sim/Nao, separados por virgula
; (o log mostra o nome de cada script que le as setas)
IgnoreScripts=

[Vehicles]
; modelos em que R3 inicia submissao (botao Missao)
MissionModels=420,438,596,597,598,599,523,427,490,528,601,432,425,447,497,430,416,407,544,575,537,538,609
; modelos em que B atira (botao Atirar dentro do veiculo, alem do drive-by com submetralhadora)
FireModels=432,564,441,407,601,430,425,520
; modelos em que LB atira (botao Atirar 2 em aeronaves armadas)
Fire2Models=425,447,464,476,520

[Debug]
; 1 grava GTMTouchSA.log na mesma pasta
Log=1
